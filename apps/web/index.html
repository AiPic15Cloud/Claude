<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le paramètre ?v= force les navigateurs à recharger l'icône après une
         refonte du logo — les favicons sont mis en cache bien plus
         agressivement que le reste (parfois indéfiniment), une URL figée ne
         se met donc jamais à jour toute seule. Incrémenter à chaque nouvelle
         version du logo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#070605" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atlas Capital" />
    <title>Atlas Capital — Real Estate Intelligence Operating System</title>
    <meta
      name="description"
      content="Atlas Capital — le système d'exploitation de l'intelligence pour le financement et l'investissement immobilier."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
